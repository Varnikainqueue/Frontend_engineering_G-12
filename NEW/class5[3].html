<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
    .container{
            width: 400px;
            margin: auto;
            border: 2px solid navy;
        }
        .square{
            width: 0px;
            height: 20px;
            background: green;
            position: relative;
        }
        #check:checked ~ .container .square {
            animation: mymoves 5s forwards;
        }
        @keyframes mymoves{
           0% {width: 0px;}
           25% {width: 100px;} 
           50% {width: 200px;}
           75% {width: 300px;}
           100% {width: 400px;}
        }
        .checkbox {
            text-align: center;
            margin: 20px;
        }
        .load{
            width: 400px;
            margin: 10px auto;
            text-align: center;
        }
    </style>
</head>
<body>
     <input type="checkbox" id="check">

    <label for="check">Start Loading</label>

    <div class="container">
        <div class="square"></div>
    </div>

    <div class="load"> Loading... </div>
</body>
</html>

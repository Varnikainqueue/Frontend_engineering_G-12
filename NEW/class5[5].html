<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="1 ; url=class2.html">
    <title>Document</title>
    <style>
    .container{
            width: 400px;
            margin: auto;
            border: 2px solid navy;
        }
        .square{
            width: 0px;
            height: 20px;
            background: green;
            position: relative;
            animation: mymoves 1s forwards;
        }
        @keyframes mymoves{
           0% {width: 0px;}
           25% {width: 100px;} 
           50% {width: 200px;}
           75% {width: 300px;}
           100% {width: 400px;}
        }
        .load{
            width: 400px;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="square"></div>
    </div>
    <div class="load"> Loading...</div>
    
</body>
</html>

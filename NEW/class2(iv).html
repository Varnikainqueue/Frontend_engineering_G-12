<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            border: 5px solid red;
            color: white;
            font-weight: bold;
            background-image: url("mountain.jpg");
            background-size: cover;
            width: 400px;
            height: 400px;
            position: relative;
            margin: auto;
            
        }
        .bottom-left{
            position: absolute;
            bottom: 10px;
            left: 10px;
        }
        .top-left{
            position: absolute;
           top: 10px;
           left: 10px;
        }
        .top-right{
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .bottom-right{
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
        .centered {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="bottom-left">Bottom Left</div>
        <div class="top-left">Top Left</div>
        <div class="top-right">Top Right</div>
        <div class="bottom-right">Bottom Right</div>
        <div class="centered">Centered</div>
    </div>
    
</body>
</html>
